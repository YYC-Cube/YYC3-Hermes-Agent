<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YYC3 Hermes Agent · 操作中心</title>
<meta name="description" content="YYC3 Hermes Agent 离线操作中心：本地起步、站点部署、品牌资产与治理安全，一处查全。">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='-apple-system,sans-serif' font-size='38' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════ 设计系统 · CSS 变量 ═══════════ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0a0a0f; --bg2:#12121a; --bg3:#1a1a2e;
  --surface:rgba(255,255,255,.03); --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.15);
  --text:#f1f1f6; --text2:rgba(255,255,255,.65); --text3:rgba(255,255,255,.35);
  --accent-v:#7c6cff; --accent-c:#22d3ee;
  --accent-e:#22c55e; --accent-r:#ef4444;
  --radius:14px; --radius-sm:8px; --shadow:0 4px 24px rgba(0,0,0,.3);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace;
  --sb-w:280px;
}
.light{
  --bg:#f5f6fb; --bg2:#ffffff; --bg3:#eceef8;
  --surface:rgba(10,10,15,.03); --surface-hover:rgba(10,10,15,.06);
  --border:rgba(10,10,15,.10); --border-hover:rgba(10,10,15,.20);
  --text:#12121a; --text2:rgba(10,10,15,.66); --text3:rgba(10,10,15,.42);
  --shadow:0 4px 24px rgba(10,10,15,.10);
}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code,pre{font-family:var(--font-mono);font-size:12.5px}
::selection{background:rgba(124,108,255,.32)}
*{scrollbar-width:thin;scrollbar-color:rgba(140,140,160,.35) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(140,140,160,.35);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent-c);outline-offset:2px;border-radius:6px}

/* ═══════════ 侧边栏 M1 ═══════════ */
.sidebar{
  position:fixed; top:0; bottom:0; left:0; width:var(--sb-w); z-index:40;
  display:flex; flex-direction:column; gap:14px; padding:18px 14px 10px;
  background:var(--bg2); border-right:1px solid var(--border);
  transition:transform .3s ease;
}
.sidebar.hidden{transform:translateX(-100%)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;padding:2px 4px;border-radius:var(--radius-sm)}
.brand-logo{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:19px;color:#fff;flex:none;
  background:linear-gradient(135deg,var(--accent-v),var(--accent-c));
  box-shadow:0 4px 14px rgba(124,108,255,.35);
}
.brand-text{min-width:0}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-search{position:relative}
.sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2}
.sb-search input{
  width:100%;padding:8px 10px 8px 32px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:13px;outline:none;transition:border-color .2s;
}
.sb-search input:focus{border-color:var(--accent-c)}
.sb-progress{padding:0 4px}
.sb-progress-head{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--text3);margin-bottom:6px}
.sb-progress-head span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-progress-head b{color:var(--text2);font-weight:600;font-family:var(--font-mono);flex:none}
.sb-progress-head b:last-child{color:var(--accent-c)}
.sb-bar{height:5px;border-radius:3px;background:var(--surface-hover);overflow:hidden}
.sb-bar span{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-v),var(--accent-c));transition:width .35s ease}
.sb-nav{flex:1;overflow-y:auto;padding:2px 2px 14px;margin:0 -2px}
.sb-group{margin-bottom:14px}
.sb-cat{display:flex;align-items:center;gap:7px;padding:0 6px 6px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3)}
.sb-cat-dot{width:8px;height:8px;border-radius:50%;flex:none}
.sb-cat-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-cat-n{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;opacity:.8}
.sb-item{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);
  font-size:13px;color:var(--text2);transition:background .18s,color .18s;cursor:pointer;
}
.sb-item:hover{background:var(--surface-hover);color:var(--text)}
.sb-item.active{background:var(--surface-hover);color:var(--text);box-shadow:inset 2px 0 0 var(--accent-c)}
.sb-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border-hover);flex:none}
.sb-item.done .sb-dot{background:var(--accent-e);border-color:var(--accent-e)}
.sb-idx{font-family:var(--font-mono);font-size:11px;color:var(--text3);flex:none;min-width:16px}
.sb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-tail{margin-left:auto;font-size:10.5px;color:var(--text3);flex:none}
.sb-ext{margin-left:auto;font-size:11px;color:var(--text3);flex:none}
.sb-foot{font-size:10.5px;color:var(--text3);padding:8px 6px 4px;border-top:1px solid var(--border);line-height:1.5}
.scrim{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}

/* ═══════════ 顶栏 M2 ═══════════ */
.main{margin-left:var(--sb-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .3s ease}
.main.expanded{margin-left:0}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:9px 20px;border-bottom:1px solid var(--border);
  background:var(--bg2);
  background:color-mix(in srgb,var(--bg) 74%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.icon-btn{
  width:34px;height:34px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--text2);border:1px solid transparent;transition:background .18s,color .18s,border-color .18s;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border)}
.icon-btn.danger:hover{color:var(--accent-r);border-color:rgba(239,68,68,.4)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.flash{color:var(--accent-e);border-color:var(--accent-e)}
.lang-btn{width:auto;display:flex;gap:5px;padding:0 9px}
.lang-tag{font-size:10.5px;font-family:var(--font-mono);letter-spacing:.4px;color:var(--text2)}
.lang-btn:hover .lang-tag{color:var(--text)}
.top-title{min-width:0;display:flex;flex-direction:column}
.top-title h1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.top-title span{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.top-search{position:relative;flex:1;max-width:340px;margin-left:6px;display:none}
.main.expanded .top-search{display:block}
.top-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:2}
.top-search input{width:100%;padding:7px 10px 7px 30px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.clock{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--text2);padding:0 8px}
.clock i{width:6px;height:6px;border-radius:50%;background:var(--accent-e);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(34,197,94,0)}}

/* ═══════════ 内容区 ═══════════ */
.content{width:100%;max-width:1400px;margin:0 auto;padding:26px 24px 60px;flex:1}

/* ═══════════ 仪表盘 M3 ═══════════ */
.hero{margin-bottom:22px}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--accent-c);
  background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.24);
}
.hero h2{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.4px;margin:12px 0 8px;line-height:1.25;text-wrap:balance}
.hero p{color:var(--text2);max-width:760px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 22px}
.stat{
  padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);position:relative;overflow:hidden;
}
.stat::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:linear-gradient(90deg,var(--accent-v),var(--accent-c));opacity:.55}
.stat b{display:block;font-size:26px;font-weight:800;font-family:var(--font-mono);line-height:1.1}
.stat span{font-size:11.5px;color:var(--text3)}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.filter-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  font-size:12.5px;color:var(--text2);border:1px solid var(--border);background:var(--surface);
  transition:border-color .18s,color .18s,background .18s;
}
.filter-btn:hover{border-color:var(--border-hover);color:var(--text)}
.filter-btn.active{
  color:var(--cat-color,var(--accent-v));
  border-color:var(--cat-color,var(--accent-v));
  background:color-mix(in srgb,var(--cat-color,var(--accent-v)) 14%,transparent);
}
.filter-btn .f-dot{width:7px;height:7px;border-radius:50%;background:var(--cat-color,var(--accent-v));flex:none}
.cat-section{margin-bottom:26px}
.cat-head{display:flex;align-items:center;gap:9px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.cat-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--surface-hover)}
.cat-name{font-size:14px;font-weight:700}
.cat-count{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.cat-meter{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.cat-meter i{display:block;width:74px;height:3px;border-radius:2px;background:var(--surface-hover);overflow:hidden}
.cat-meter i b{display:block;height:100%;width:0;background:var(--cat-color,var(--accent-v));transition:width .35s ease}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* ═══════════ 条目卡片 M4 ═══════════ */
.gcard{
  position:relative;padding:16px 16px 14px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface);cursor:pointer;overflow:hidden;
  transition:transform .22s ease,border-color .22s ease,background .22s ease;
  animation:fadeUp .45s ease both;animation-delay:calc(var(--i,0)*38ms);
  display:flex;flex-direction:column;gap:9px;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.gcard:hover{transform:translateY(-2px);border-color:var(--border-hover);background:var(--surface-hover)}
.gc-bar{position:absolute;inset:0 0 auto 0;height:3px;background:var(--cat-color,var(--accent-v))}
.gc-badge{
  position:absolute;top:12px;right:14px;font-size:10.5px;font-family:var(--font-mono);
  padding:2px 7px;border-radius:999px;color:var(--text2);
  background:var(--surface-hover);border:1px solid var(--border);
}
.gc-badge.full{color:var(--accent-e);border-color:rgba(34,197,94,.35)}
.gc-head{display:flex;align-items:flex-start;gap:10px;padding-right:58px}
.gc-ico{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none;
  background:var(--surface-hover);
  background:color-mix(in srgb,var(--cat-color,var(--accent-v)) 16%,transparent);
}
.gc-title{font-size:14px;font-weight:700;line-height:1.4;letter-spacing:.1px}
.gc-meta{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text3);flex-wrap:wrap}
.gc-meta .dm{color:var(--text2)}
.gc-desc{font-size:12.5px;color:var(--text2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.gc-tags{display:flex;gap:5px;flex-wrap:wrap}
.gc-tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--surface-hover);color:var(--text3);border:1px solid var(--border)}
.gc-steps{border-top:1px dashed var(--border);padding-top:9px;display:flex;flex-direction:column;gap:4px}
.gc-steps-h{font-size:10.5px;color:var(--text3);letter-spacing:.4px;text-transform:uppercase}
.gc-step{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text2);padding:2px 0;border-radius:4px}
.gc-step:hover{color:var(--text)}
.gc-step .n{font-family:var(--font-mono);font-size:10px;color:var(--text3);flex:none}
.gc-step.sd .n{color:var(--accent-e)}
.gc-step .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-more{font-size:11.5px;color:var(--accent-c);font-weight:600;padding:2px 0}
.gc-more:hover{text-decoration:underline}
.done-circle{
  position:absolute;top:14px;right:14px;width:0;height:0;opacity:0;pointer-events:none;
}
.gc-done{
  position:absolute;bottom:12px;right:16px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--border-hover);display:grid;place-items:center;
  font-size:11px;color:transparent;transition:all .2s;background:transparent;
}
.gcard:hover .gc-done{border-color:var(--accent-e)}
.gc-done.on{background:var(--accent-e);border-color:var(--accent-e);color:#fff}
.gcard.is-done{border-color:rgba(34,197,94,.30)}
.gcard.is-done .gc-title{color:var(--text2)}

/* ═══════════ 详情页 M5 ═══════════ */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text3);margin-bottom:16px;padding:4px 0}
.back:hover{color:var(--accent-c)}
.d-hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.d-icon{
  width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;
  background:var(--surface-hover);
  background:color-mix(in srgb,var(--cat-color,var(--accent-v)) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--cat-color,var(--accent-v)) 32%,transparent);
}
.d-hero h2{font-size:clamp(19px,2.6vw,25px);font-weight:800;letter-spacing:-.3px;line-height:1.3}
.d-hero p{font-size:13px;color:var(--text2);margin-top:6px;max-width:820px}
.d-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text2)}
.pill.cat{color:var(--cat-color,var(--accent-v));border-color:color-mix(in srgb,var(--cat-color,var(--accent-v)) 34%,transparent)}
.pbar-wrap{margin:18px 0 22px}
.pbar-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text3);margin-bottom:6px;font-family:var(--font-mono)}
.pbar{height:6px;border-radius:3px;background:var(--surface-hover);overflow:hidden}
.pbar span{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-v),var(--accent-c));transition:width .35s ease}
.block-h{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;font-weight:600}
.prereq{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px;margin-bottom:22px}
.prereq li{font-size:12.5px;color:var(--text2);display:flex;gap:7px;align-items:flex-start}
.prereq li::before{content:'▸';color:var(--accent-c);flex:none}
.steps{display:flex;flex-direction:column;gap:9px}
.step{
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);
  overflow:hidden;transition:border-color .2s,background .2s;
}
.step:hover{border-color:var(--border-hover)}
.step.is-danger{border-color:rgba(239,68,68,.35)}
.step-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.step-dot{
  width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-family:var(--font-mono);color:var(--text2);
  border:1.5px solid var(--border-hover);background:transparent;transition:all .2s;
}
.step-dot:hover{border-color:var(--accent-e)}
.step.is-done .step-dot{background:var(--accent-e);border-color:var(--accent-e);color:#fff}
.step-title{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.is-done .step-title{color:var(--text2);text-decoration:line-through;text-decoration-color:var(--text3)}
.step-time{font-size:10.5px;color:var(--text3);font-family:var(--font-mono);flex:none}
.step-caret{font-size:9px;color:var(--text3);flex:none;transition:transform .2s}
.step.is-open .step-caret{transform:rotate(90deg)}
.step-body{display:none;padding:0 14px 14px 44px;flex-direction:column;gap:10px}
.step.is-open .step-body{display:flex}
.step-body p{font-size:12.5px;color:var(--text2);line-height:1.65}
.code-block{
  border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg3);background:color-mix(in srgb,var(--bg3) 60%,var(--bg2));
}
.code-head{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.code-lang{font-size:10px;color:var(--text3);font-family:var(--font-mono);letter-spacing:.6px;text-transform:uppercase}
.copy-btn{margin-left:auto;font-size:10.5px;color:var(--text2);padding:2px 8px;border-radius:5px;border:1px solid var(--border);transition:all .18s}
.copy-btn:hover{color:var(--accent-c);border-color:var(--accent-c)}
.copy-btn.ok{color:var(--accent-e);border-color:var(--accent-e)}
.code-block pre{margin:0;padding:10px 12px;overflow-x:auto;color:var(--text);line-height:1.65}
.code-block code{white-space:pre;color:#c9d6ff}
.light .code-block code{color:#2a3356}
.note{display:flex;gap:8px;padding:9px 11px;border-radius:var(--radius-sm);font-size:12px;line-height:1.6}
.note.warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.28);color:#fca5a5}

.light .note.tip{color:#0e7490}
.note b{flex:none}
.step-flash{animation:flashRing 1.6s ease 1}

.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}

.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
.modal-panel{
  position:relative;width:100%;max-width:560px;max-height:84vh;display:flex;flex-direction:column;
  background:var(--bg2);border:1px solid var(--border-hover);border-radius:var(--radius);box-shadow:var(--shadow);
  animation:pop .22s ease both;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head .mi{font-size:16px;flex:none}
.modal-head h3{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-body{overflow-y:auto;padding:8px}
.m-step{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .18s}
.m-step:hover{background:var(--surface-hover)}
.m-step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-family:var(--font-mono);border:1.5px solid var(--border-hover);flex:none;color:var(--text3)}
.m-step.sd .n{background:var(--accent-e);border-color:var(--accent-e);color:#fff}
.m-step .t{font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-step .tm{font-size:10.5px;color:var(--text3);font-family:var(--font-mono);flex:none}
.m-step .ck{font-size:10px;color:var(--accent-e);flex:none;width:12px}

/* ═══════════ 技能面板 M7 ═══════════ */
.sk-cats{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 20px}
.sk-cat-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;
  color:var(--text2);border:1px solid var(--border);background:var(--surface);
}
.sk-cat-btn .d{width:7px;height:7px;border-radius:50%;background:var(--sk-color,var(--accent-v));flex:none}
.sk-cat-btn.active{color:var(--sk-color,var(--accent-v));border-color:var(--sk-color,var(--accent-v));background:color-mix(in srgb,var(--sk-color,var(--accent-v)) 14%,transparent)}
.sk-sec{margin-bottom:22px}
.sk-sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sk-sec-head .e{font-size:15px}
.sk-sec-head .n{font-size:13.5px;font-weight:700}
.sk-stars{font-size:10px;letter-spacing:1px;color:var(--sk-color,var(--accent-v));font-family:var(--font-mono)}
.sk-sec-head .c{margin-left:auto;font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.sk-card{padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);transition:border-color .2s}
.sk-card:hover{border-color:var(--border-hover)}
.sk-name{font-size:13px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.sk-name .st{font-size:9.5px;color:var(--sk-color,var(--accent-v));letter-spacing:.5px;font-family:var(--font-mono)}
.sk-desc{font-size:11.5px;color:var(--text3);line-height:1.55;margin-bottom:9px}
.sk-cmd{
  display:block;width:100%;text-align:left;font-family:var(--font-mono);font-size:11.5px;
  padding:8px 10px;border-radius:6px;background:var(--bg2);border:1px dashed var(--border-hover);
  color:var(--text2);overflow-x:auto;white-space:pre;transition:all .18s;cursor:pointer;
}
.sk-cmd:hover{color:var(--accent-c);border-color:var(--accent-c);background:var(--surface-hover)}
.sk-hint{font-size:10px;color:var(--text3);margin-top:5px}

/* ═══════════ 全局态 M8 ═══════════ */
.empty{padding:44px 20px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);color:var(--text3)}
.empty h3{font-size:14px;color:var(--text2);margin-bottom:5px}
.empty p{font-size:12px}
.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;gap:14px;background:var(--bg);transition:opacity .35s ease}
.loading.gone{opacity:0;pointer-events:none}
.loading .inner{display:flex;flex-direction:column;align-items:center;gap:12px}
.spinner{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-hover);border-top-color:var(--accent-c);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:12px;color:var(--text3)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{
  padding:8px 15px;border-radius:999px;font-size:12px;color:var(--text);
  background:var(--bg3);border:1px solid var(--border-hover);box-shadow:var(--shadow);
  animation:toastIn .25s ease both;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.err-bar{position:fixed;left:0;right:0;top:0;z-index:95;display:none;align-items:center;gap:10px;padding:9px 16px;background:rgba(239,68,68,.94);color:#fff;font-size:12px}
.err-bar.on{display:flex}
.err-bar b{flex:none}
.err-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err-bar button{color:#fff;font-size:16px;line-height:1;padding:0 4px}
.foot{margin-top:38px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11.5px;color:var(--text3)}
.foot a{color:var(--text2);border-bottom:1px solid transparent}
.foot a:hover{color:var(--accent-c);border-bottom-color:var(--accent-c)}
.foot .sep{opacity:.5}

/* ═══════════ 响应式 ═══════════ */
@media (max-width:768px){
  .sidebar{width:min(300px,84vw);transform:translateX(-100%);box-shadow:var(--shadow)}

  .sidebar.hidden{transform:translateX(-100%)}
  .main,.main.expanded{margin-left:0}

  .stat:last-child{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
  .main.expanded .top-search{display:none}
  .top-actions{gap:2px}
}
@media (max-width:480px){
  .share-holder{display:none}
  .content{padding:14px 11px 40px}
  .hero h2{font-size:20px}

  .stat b{font-size:22px}
  .step-body{padding-left:16px}
  .d-hero{gap:10px}
  .d-icon{width:38px;height:38px;font-size:17px}
  .top-actions .icon-btn{width:30px;height:30px}
  .gc-head{padding-right:52px}
}
@media (hover:none) and (pointer:coarse){
  .icon-btn,.filter-btn,.sk-cat-btn,.sk-cmd,.gc-more{min-height:36px}
  .step-dot{width:36px;height:36px}
  .gc-step{min-height:30px}
  .m-step{min-height:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media print{

}

  }
  function catName(c) { return currentLang === 'en' ? c.en : c.zh; }
  function catColor(key) { return catOf(key).color; }
  function skillCatOf(key) {
    for (var i = 0; i < SKILL_CATS.length; i++) if (SKILL_CATS[i].key === key) return SKILL_CATS[i];
    return { key: key, emoji: '•', zh: key, en: key, stars: 1, color: '#7c6cff' };
  }

  /* ═══ 状态 ═══ */
  var state = { view: 'dashboard', guideId: null, filter: 'all', q: '', modalId: null, skillCat: 'all' };

  function isDone(id) { return lsGet('guide-done-' + id, '0') === '1'; }
  function setDone(id, v) { if (v) lsSet('guide-done-' + id, '1'); else lsDel('guide-done-' + id); }
  function isStepDone(id, n) { return lsGet('step-done-' + id + '-' + n, '0') === '1'; }
  function setStepDone(id, n, v) { if (v) lsSet('step-done-' + id + '-' + n, '1'); else lsDel('step-done-' + id + '-' + n); }
  function isStepOpen(id, n) { return lsGet('step-open-' + id + '-' + n, n === 1 ? '1' : '0') === '1'; }
  function setStepOpen(id, n, v) { lsSet('step-open-' + id + '-' + n, v ? '1' : '0'); }

  function guideById(id) {
    for (var i = 0; i < GUIDES.length; i++) if (GUIDES[i].id === id) return GUIDES[i];
    return null;
  }
  function doneSteps(g) {
    var n = 0;
    for (var i = 0; i < g.steps.length; i++) if (isStepDone(g.id, g.steps[i].n)) n++;
    return n;
  }
  function overallPct() {
    var total = 0, done = 0;
    for (var i = 0; i < GUIDES.length; i++) { total++; if (isDone(GUIDES[i].id)) done++; }
    return total ? Math.round(done / total * 100) : 0;
  }
  function matchGuide(g, q) {
    if (!q) return true;
    var hay = [g.id, g.title, g.titleEn, g.desc, g.descEn, catName(catOf(g.cat)), g.cat].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  /* ═══ 主题 ═══ */
  var SUN = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"></path>';
  var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>';
  function isLight() { return document.documentElement.classList.contains('light'); }
  function syncThemeIcon() {
    var el = document.getElementById('themeIcon');
    if (el) el.innerHTML = isLight() ? SUN : MOON;
  }
  function toggleTheme() {
    var next = !isLight();
    document.documentElement.classList.toggle('light', next);
    lsSet('theme', next ? 'light' : 'dark');
    var m = document.querySelector('meta[name="color-scheme"]');
    if (m) m.setAttribute('content', next ? 'light dark' : 'dark light');
    syncThemeIcon();
  }

  /* ═══ 静态 i18n ═══ */
  function syncLangLabel() {
    var tag = document.getElementById('langTag');
    if (tag) tag.textContent = t('_label');
  }
  function applyStaticI18n() {
    document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
    document.title = t('docTitle');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    var phs = document.querySelectorAll('[data-i18n-ph]');
    for (var j = 0; j < phs.length; j++) phs[j].setAttribute('placeholder', t(phs[j].getAttribute('data-i18n-ph')));
    var tts = document.querySelectorAll('[data-i18n-title]');
    for (var k = 0; k < tts.length; k++) {
      var v = t(tts[k].getAttribute('data-i18n-title'));
      tts[k].setAttribute('title', v);
      tts[k].setAttribute('aria-label', v);
    }
    syncLangLabel();
    syncThemeIcon();
  }

  /* ═══ 侧边栏 M1 ═══ */
  function renderSidebar() {
    var q = state.q.trim().toLowerCase();
    var nav = document.getElementById('sbNav');
    if (!nav) return;
    var html = '';
    for (var ci = 0; ci < CATEGORIES.length; ci++) {
      var c = CATEGORIES[ci];
      if (c.key === 'skills') continue;
      var list = [];
      for (var gi = 0; gi < GUIDES.length; gi++) {
        if (GUIDES[gi].cat === c.key && matchGuide(GUIDES[gi], q)) list.push(GUIDES[gi]);
      }
      if (!list.length) continue;
      html += '<div class="sb-group"><div class="sb-cat"><span class="sb-cat-dot" style="background:' + c.color + '"></span>' +
        '<span class="sb-cat-name">' + escHtml(catName(c)) + '</span>' +
        '<span class="sb-cat-n">' + list.length + '</span></div>';
      for (var li = 0; li < list.length; li++) {
        var g = list[li];
        var act = (state.view === 'detail' && state.guideId === g.id) ? ' active' : '';
        var dn = isDone(g.id) ? ' done' : '';
        html += '<a class="sb-item' + act + dn + '" data-act="open-guide" data-id="' + escHtml(g.id) + '" href="#guide-' + escHtml(g.id) + '">' +
          '<span class="sb-dot"></span>' +
          '<span class="sb-idx">' + g.order + '.</span>' +
          '<span class="sb-t">' + escHtml(guideTitle(g)) + '</span>' +
          '<span class="sb-tail">' + escHtml(diffStars(g.diff)) + '</span></a>';
      }
      html += '</div>';
    }
    var skActive = (state.view === 'skills') ? ' active' : '';
    html += '<div class="sb-group"><a class="sb-item' + skActive + '" data-act="nav-skills" href="#skills">' +
      '<span class="sb-dot"></span><span class="sb-idx">⌘</span>' +
      '<span class="sb-t">' + escHtml(t('navSkills')) + '</span>' +
      '<span class="sb-tail">' + SKILLS.length + '</span></a></div>';
    nav.innerHTML = html;

    var pct = overallPct();
    var fill = document.getElementById('sbFill');
    var pctEl = document.getElementById('sbPct');
    var cntEl = document.getElementById('sbCount');
    var doneTotal = 0;
    for (var di = 0; di < GUIDES.length; di++) if (isDone(GUIDES[di].id)) doneTotal++;
    if (fill) fill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';
    if (cntEl) cntEl.textContent = doneTotal + '/' + GUIDES.length;
  }

  /* ═══ 卡片 M4 ═══ */
  function cardHtml(g, idx) {
    var c = catOf(g.cat);
    var done = isDone(g.id);
    var sd = doneSteps(g);
    var total = g.steps.length;
    var pct = total ? Math.round(sd / total * 100) : 0;
    var badgeCls = pct === 100 ? 'gc-badge full' : 'gc-badge';
    var preview = '';
    for (var i = 0; i < Math.min(3, total); i++) {
      var s = g.steps[i];
      var sdone = isStepDone(g.id, s.n) ? ' sd' : '';
      preview += '<span class="gc-step' + sdone + '" data-act="step-jump" data-id="' + escHtml(g.id) + '" data-n="' + s.n + '">' +
        '<span class="n">' + (isStepDone(g.id, s.n) ? '✓' : s.n) + '</span>' +
        '<span class="t">' + escHtml(pick(s, 'title')) + '</span></span>';
    }
    var tags = '';
    var pre = g.prereq || [];
    for (var pi = 0; pi < Math.min(3, pre.length); pi++) tags += '<span class="gc-tag">' + escHtml(pick(pre[pi], 'zh')) + '</span>';
    if (!tags) tags = '<span class="gc-tag">' + escHtml(t('noPrereq')) + '</span>';
    var more = '<span class="gc-more" data-act="open-modal" data-id="' + escHtml(g.id) + '">' + escHtml(tf('viewAll', { n: total })) + '</span>';
    return '<article class="gcard' + (done ? ' is-done' : '') + '" style="--cat-color:' + c.color + ';--i:' + idx + '" data-act="open-guide" data-id="' + escHtml(g.id) + '">' +
      '<span class="gc-bar"></span>' +
      '<span class="' + badgeCls + '">' + escHtml(tf('stepsDoneFmt', { a: sd, b: total })) + '</span>' +
      '<div class="gc-head"><span class="gc-ico">' + escHtml(g.icon) + '</span><div><div class="gc-title">' + g.order + '. ' + escHtml(guideTitle(g)) + '</div></div></div>' +
      '<div class="gc-meta"><span class="dm">' + escHtml(catName(c)) + '</span><span>' + escHtml(diffLabel(g.diff)) + '</span><span>' + escHtml(g.time) + '</span></div>' +
      '<p class="gc-desc">' + escHtml(pick(g, 'desc')) + '</p>' +
      '<div class="gc-tags">' + tags + '</div>' +
      '<div class="gc-steps"><div class="gc-steps-h">' + escHtml(t('stepsPreview')) + '</div>' + preview + more + '</div>' +
      '<button class="gc-done' + (done ? ' on' : '') + '" type="button" data-act="toggle-done" data-id="' + escHtml(g.id) + '" title="' + escHtml(done ? t('guideUndone') : t('guideDone')) + '" aria-label="' + escHtml(done ? t('guideUndone') : t('guideDone')) + '">✓</button>' +
      '</article>';
  }

  /* ═══ 仪表盘 M3 ═══ */
  function renderDashboard() {
    var host = document.getElementById('content');
    if (!host) return;
    var total = GUIDES.length;
    var catsUsed = 0, doneCount = 0;
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].key !== 'skills') catsUsed++;
    for (var j = 0; j < GUIDES.length; j++) if (isDone(GUIDES[j].id)) doneCount++;

    var filters = '<button class="filter-btn' + (state.filter === 'all' ? ' active' : '') + '" type="button" data-act="filter" data-cat="all">' +
      '<span class="f-dot" style="background:var(--accent-v)"></span>' + escHtml(t('filterAll')) + '</button>';
    for (var k = 0; k < CATEGORIES.length; k++) {
      var c = CATEGORIES[k];
      filters += '<button class="filter-btn' + (state.filter === c.key ? ' active' : '') + '" type="button" data-act="filter" data-cat="' + escHtml(c.key) + '" style="--cat-color:' + c.color + '">' +
        '<span class="f-dot"></span>' + escHtml(c.emoji + ' ' + catName(c)) + '</button>';
    }

    var q = state.q.trim().toLowerCase();
    var sections = '', shown = 0, idx = 0;
    for (var m = 0; m < CATEGORIES.length; m++) {
      var cat = CATEGORIES[m];
      if (cat.key === 'skills') continue;
      if (state.filter !== 'all' && state.filter !== cat.key) continue;
      var list = [];
      for (var n = 0; n < GUIDES.length; n++) if (GUIDES[n].cat === cat.key && matchGuide(GUIDES[n], q)) list.push(GUIDES[n]);
      if (!list.length) continue;
      var cd = 0;
      for (var p = 0; p < list.length; p++) if (isDone(list[p].id)) cd++;
      var cards = '';
      for (var r = 0; r < list.length; r++) { cards += cardHtml(list[r], idx); idx++; }
      shown += list.length;
      sections += '<section class="cat-section" style="--cat-color:' + cat.color + '">' +
        '<div class="cat-head"><span class="cat-ico">' + escHtml(cat.emoji) + '</span>' +
        '<span class="cat-name">' + escHtml(catName(cat)) + '</span>' +
        '<span class="cat-count">' + list.length + '</span>' +
        '<span class="cat-meter"><i><b style="width:' + Math.round(cd / list.length * 100) + '%"></b></i><span>' + cd + '/' + list.length + '</span></span></div>' +
        '<div class="grid">' + cards + '</div></section>';
    }
    if (!shown) sections = '<div class="empty"><h3>' + escHtml(t('emptyTitle')) + '</h3><p>' + escHtml(t('emptyDesc')) + '</p></div>';

    host.innerHTML = '<div class="hero">' +
      '<span class="badge">' + escHtml(tf('dashBadge', { n: total, c: catsUsed })) + '</span>' +
      '<h2>' + escHtml(t('dashTitle')) + '</h2>' +
      '<p>' + escHtml(t('dashDesc')) + '</p></div>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + total + '</b><span>' + escHtml(t('statAll')) + '</span></div>' +
      '<div class="stat"><b>' + catsUsed + '</b><span>' + escHtml(t('statCats')) + '</span></div>' +
      '<div class="stat"><b>' + doneCount + '</b><span>' + escHtml(t('statDone')) + '</span></div></div>' +
      '<div class="filters" role="tablist">' + filters + '</div>' +
      sections + footerHtml();

    setTopTitle(t('appName'), t('appSub'));
  }

  /* ═══ 详情 M5 ═══ */
  function stepHtml(g, s) {
    var sdone = isStepDone(g.id, s.n);
    var open = isStepOpen(g.id, s.n);
    var cls = 'step' + (sdone ? ' is-done' : '') + (open ? ' is-open' : '') + (s.isDestructive ? ' is-danger' : '');
    var body = '<div class="step-body"><p>' + escHtml(pick(s, 'content')) + '</p>';
    if (s.code && s.code.length) {
      for (var ci = 0; ci < s.code.length; ci++) {
        var blk = s.code[ci];
        body += '<div class="code-block"><div class="code-head"><span class="code-lang">' + escHtml(blk[0]) + '</span>' +
          '<button class="copy-btn" type="button" data-act="copy">' + escHtml(t('copyCmd')) + '</button></div>' +
          '<pre><code>' + escHtml(blk[1]) + '</code></pre></div>';
      }
    }
    if (s.warning) body += '<div class="note warn"><b>!</b><span>' + escHtml(pick(s, 'warning')) + '</span></div>';
    if (s.tip) body += '<div class="note tip"><b>i</b><span>' + escHtml(pick(s, 'tip')) + '</span></div>';
    body += '</div>';

    return '<div class="' + cls + '" data-step="' + s.n + '">' +
      '<div class="step-head" data-act="step-open" data-id="' + escHtml(g.id) + '" data-n="' + s.n + '" role="button" tabindex="0">' +
      '<button class="step-dot" type="button" data-act="step-done" data-id="' + escHtml(g.id) + '" data-n="' + s.n + '" aria-label="' + escHtml(sdone ? t('undoMark') : t('doneMark')) + '">' + (sdone ? '✓' : s.n) + '</button>' +
      '<span class="step-title">' + escHtml(pick(s, 'title')) + '</span>' +
      '<span class="step-time">' + escHtml(s.time) + '</span>' +
      '<span class="step-caret">▶</span></div>' + body + '</div>';
  }

  function renderDetail(id) {
    var g = guideById(id);
    var host = document.getElementById('content');
    if (!g || !host) { goHome(); return; }
    var c = catOf(g.cat);
    var sd = doneSteps(g);
    var total = g.steps.length;
    var pct = total ? Math.round(sd / total * 100) : 0;
    var steps = '';
    for (var i = 0; i < total; i++) steps += stepHtml(g, g.steps[i]);

    var pre = g.prereq || [];
    var preHtml = '';
    if (pre.length) {
      preHtml += '<div class="block-h">' + escHtml(t('prereq')) + '</div><ul class="prereq">';
      for (var j = 0; j < pre.length; j++) preHtml += '<li><span>' + escHtml(pick(pre[j], 'zh')) + '</span></li>';
      preHtml += '</ul>';
    }

    host.innerHTML = '<a class="back" data-act="home" href="#">← ' + escHtml(t('backToDash')) + '</a>' +
      '<div class="d-hero"><span class="d-icon" style="--cat-color:' + c.color + '">' + escHtml(g.icon) + '</span>' +
      '<div><h2>' + escHtml(g.order + '. ' + guideTitle(g)) + '</h2>' +
      '<p>' + escHtml(pick(g, 'desc')) + '</p>' +
      '<div class="block-h">' + escHtml(t('overview')) + '</div>' +
      '<div class="d-pills">' +
      '<span class="pill cat" style="--cat-color:' + c.color + '">' + escHtml(t('category') + ' · ' + catName(c)) + '</span>' +
      '<span class="pill">' + escHtml(t('difficulty') + ' · ' + diffLabel(g.diff)) + '</span>' +
      '<span class="pill">' + escHtml(t('costTime') + ' · ' + g.time) + '</span>' +
      '<span class="pill">' + escHtml(sd + '/' + total + ' ' + t('stepsUnit')) + '</span>' +
      '</div></div></div>' +
      '<div class="pbar-wrap"><div class="pbar-head"><span id="pbarTxt">' + escHtml(tf('progressCount', { done: sd, total: total })) + '</span><span id="pbarPct">' + pct + '%</span></div>' +
      '<div class="pbar"><span id="pbarFill" style="width:' + pct + '%"></span></div></div>' +
      preHtml +
      '<div class="block-h">' + escHtml(t('stepsTitle')) + '</div>' +
      '<div class="steps">' + steps + '</div>' +
      footerHtml();

    setTopTitle(guideTitle(g), catName(c));
  }

  /* ═══ 技能面板 M7 ═══ */
  function renderSkills() {
    var host = document.getElementById('content');
    if (!host) return;
    var q = state.q.trim().toLowerCase();
    var cats = '<button class="sk-cat-btn' + (state.skillCat === 'all' ? ' active' : '') + '" type="button" data-act="sk-cat" data-cat="all" style="--sk-color:#7c6cff"><span class="d" style="background:#7c6cff"></span>' + escHtml(t('filterAll')) + '</button>';
    for (var i = 0; i < SKILL_CATS.length; i++) {
      var sc = SKILL_CATS[i];
      cats += '<button class="sk-cat-btn' + (state.skillCat === sc.key ? ' active' : '') + '" type="button" data-act="sk-cat" data-cat="' + escHtml(sc.key) + '" style="--sk-color:' + sc.color + '">' +
        '<span class="d"></span>' + escHtml(sc.emoji + ' ' + (currentLang === 'en' ? sc.en : sc.zh)) + '</button>';
    }

    var secs = '', shown = 0;
    for (var j = 0; j < SKILL_CATS.length; j++) {
      var s2 = SKILL_CATS[j];
      if (state.skillCat !== 'all' && state.skillCat !== s2.key) continue;
      var items = [];
      for (var k = 0; k < SKILLS.length; k++) {
        var it = SKILLS[k];
        if (it.cat !== s2.key) continue;
        if (q && (it.name + ' ' + it.desc + ' ' + it.cmd).toLowerCase().indexOf(q) === -1) continue;
        items.push(it);
      }
      if (!items.length) continue;
      shown += items.length;
      var cards = '';
      for (var m = 0; m < items.length; m++) {
        var it2 = items[m];
        cards += '<div class="sk-card" style="--sk-color:' + s2.color + '">' +
          '<div class="sk-name">' + escHtml(it2.name) + '<span class="st">' + stars(s2.stars) + '</span></div>' +
          '<div class="sk-desc">' + escHtml(it2.desc) + '</div>' +
          '<button class="sk-cmd" type="button" data-act="copy-skill">' + escHtml(it2.cmd) + '</button>' +
          '<div class="sk-hint">' + escHtml(t('copyCmd')) + '</div></div>';
      }
      secs += '<section class="sk-sec" style="--sk-color:' + s2.color + '">' +
        '<div class="sk-sec-head"><span class="e">' + escHtml(s2.emoji) + '</span>' +
        '<span class="n">' + escHtml(currentLang === 'en' ? s2.en : s2.zh) + '</span>' +
        '<span class="sk-stars" title="' + escHtml(t('complexity')) + '">' + stars(s2.stars) + '</span>' +
        '<span class="c">' + escHtml(tf('skillCount', { n: items.length })) + '</span></div>' +
        '<div class="sk-grid">' + cards + '</div></section>';
    }
    if (!shown) secs = '<div class="empty"><h3>' + escHtml(t('emptyTitle')) + '</h3><p>' + escHtml(t('emptyDesc')) + '</p></div>';

    host.innerHTML = '<div class="hero"><span class="badge">' + escHtml(tf('skillsBadge', { n: SKILLS.length })) + '</span>' +
      '<h2>' + escHtml(t('skillsTitle')) + '</h2>' +
      '<p>' + escHtml(tf('skillsDesc', { n: SKILL_CATS.length })) + '</p></div>' +
      '<div class="sk-cats">' + cats + '</div>' + secs + footerHtml();

    setTopTitle(t('skillsTitle'), t('navSkills'));
  }
  function stars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆';
    return s;
  }

  /* ═══ 页脚 ═══ */
  function footerHtml() {
    return '<footer class="foot">' +
      '<a href="' + escHtml(LINKS.repo) + '" target="_blank" rel="noopener">' + escHtml(t('repoLink')) + '</a><span class="sep">·</span>' +
      '<a href="' + escHtml(LINKS.site) + '" target="_blank" rel="noopener">' + escHtml(t('siteLink')) + '</a><span class="sep">·</span>' +
      '<a href="' + escHtml(LINKS.docs) + '" target="_blank" rel="noopener">' + escHtml(t('docsLink')) + '</a>' +
      '<span style="margin-left:auto">' + escHtml(t('footerNote')) + '</span></footer>';
  }

  function setTopTitle(main, sub) {
    var a = document.getElementById('topTitle');
    var b = document.getElementById('topSub');
    if (a) a.textContent = main;
    if (b) b.textContent = sub;
  }

  /* ═══ 渲染分发 ═══ */
  function renderMain() {
    if (state.view === 'skills') renderSkills();
    else if (state.view === 'detail' && state.guideId) renderDetail(state.guideId);
    else renderDashboard();
  }
  function rerender() {
    var y = window.scrollY;
    renderSidebar();
    renderMain();
    window.scrollTo(0, y);
  }

  /* ═══ 弹窗 M6 ═══ */
  function openModal(id) {
    var g = guideById(id);
    if (!g) return;
    state.modalId = id;
    document.getElementById('modalIco').textContent = g.icon;
    document.getElementById('modalTitle').textContent = tf('modalTitle', { t: guideTitle(g) });
    var body = '';
    for (var i = 0; i < g.steps.length; i++) {
      var s = g.steps[i];
      var sd = isStepDone(g.id, s.n);
      body += '<div class="m-step' + (sd ? ' sd' : '') + '" data-act="step-jump" data-id="' + escHtml(g.id) + '" data-n="' + s.n + '">' +
        '<span class="n">' + (sd ? '✓' : s.n) + '</span>' +
        '<span class="t">' + escHtml(pick(s, 'title')) + '</span>' +
        '<span class="tm">' + escHtml(s.time) + '</span>' +
        '<span class="ck">' + (sd ? '✓' : '') + '</span></div>';
    }
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('on');
  }
  function closeModal() {
    state.modalId = null;
    document.getElementById('modal').classList.remove('on');
  }
  function refreshModal() { if (state.modalId) openModal(state.modalId); }

  /* ═══ 提示与剪贴板 ═══ */
  function toast(msg) {
    var wrap = document.getElementById('toasts');
    if (!wrap) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .3s';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }, 1900);
  }
  function legacyCopy(txt) {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? t('copyOk') : t('copyFail'));
    } catch (e) { toast(t('copyFail')); }
  }
  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast(t('copyOk')); }, function () { legacyCopy(txt); });
    } else legacyCopy(txt);
  }

  /* ═══ 进度导出 / 导入 / 重置 ═══ */
  function stamp() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportProgress() {
    var payload = { app: 'YYC3-HERMES-HUB', version: 1, exportTime: new Date().toISOString(), lang: currentLang, guides: {}, steps: {} };
    for (var i = 0; i < GUIDES.length; i++) {
      var g = GUIDES[i];
      if (isDone(g.id)) payload.guides[g.id] = { done: true };
      payload.steps[g.id] = {};
      for (var j = 0; j < g.steps.length; j++) {
        var s = g.steps[j];
        var d = isStepDone(g.id, s.n), o = isStepOpen(g.id, s.n);
        if (d || o) payload.steps[g.id][s.n] = { done: d, open: o };
      }
    }
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'yyc3-hermes-progress-' + stamp() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1200);
    toast(t('exportOk'));
  }
  function applyImport(data) {
    if (!data || typeof data !== 'object') return false;
    var ok = false;
    var gp = data.guides || {};
    for (var id in gp) {
      if (!Object.prototype.hasOwnProperty.call(gp, id)) continue;
      if (!guideById(id)) continue;
      if (gp[id] && gp[id].done) { setDone(id, true); ok = true; }
    }
    var sp = data.steps || {};
    for (var gid in sp) {
      if (!Object.prototype.hasOwnProperty.call(sp, gid)) continue;
      var g = guideById(gid);
      if (!g) continue;
      for (var n in sp[gid]) {
        if (!Object.prototype.hasOwnProperty.call(sp[gid], n)) continue;
        var rec = sp[gid][n] || {};
        if (rec.done) { setStepDone(gid, n, true); ok = true; }
        if (rec.open !== undefined) { setStepOpen(gid, n, !!rec.open); ok = true; }
      }
    }
    return ok;
  }
  function importProgress(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      var data = null;
      try { data = JSON.parse(String(rd.result)); } catch (e) { data = null; }
      var ok = applyImport(data);
      if (!ok) { alert(t('importErr')); return; }
      toast(t('importOk'));
      applyRoute(true);
    };
    rd.onerror = function () { alert(t('importErr')); };
    rd.readAsText(file);
  }
  function resetProgress() {
    if (!confirm(t('resetConfirm'))) return;
    var kill = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('guide-done-') === 0 || k.indexOf('step-done-') === 0 || k.indexOf('step-open-') === 0)) kill.push(k);
      }
    } catch (e) {}
    for (var j = 0; j < kill.length; j++) lsDel(kill[j]);
    toast(t('resetOk'));
    applyRoute(true);
  }

  /* ═══ 分享 ═══ */
  function flashShare() {
    var b = document.getElementById('shareBtn');
    if (!b) return;
    b.classList.add('flash');
    setTimeout(function () { b.classList.remove('flash'); }, 2000);
  }
  function doShare() {
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: t('appName'), text: t('appSub'), url: url }).then(flashShare, function (err) {
        if (err && err.name === 'AbortError') return;
        copyText(url);
        flashShare();
      });
      return;
    }
    copyText(url);
    flashShare();
    toast(t('shareOk'));
  }

  /* ═══ 主题 / 语言切换 ═══ */
  function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    lsSet('lang', currentLang);
    applyStaticI18n();
    renderSidebar();
    renderMain();
    refreshModal();
    restoreFilterActive();
  }
  function restoreFilterActive() {
    var btns = document.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) {
      var cat = btns[i].getAttribute('data-cat');
      btns[i].classList.toggle('active', cat === state.filter);
    }
    var sk = document.querySelectorAll('.sk-cat-btn');
    for (var j = 0; j < sk.length; j++) sk[j].classList.toggle('active', sk[j].getAttribute('data-cat') === state.skillCat);
  }

  /* ═══ 搜索 ═══ */
  function setQuery(v) {
    state.q = v;
    var a = document.getElementById('sbSearch');
    var b = document.getElementById('topSearch');
    if (a && a.value !== v) a.value = v;
    if (b && b.value !== v) b.value = v;
    if (state.view === 'skills') { renderSidebar(); renderSkills(); }
    else if (state.view === 'detail') { renderSidebar(); }
    else { renderSidebar(); renderDashboard(); }
  }
  var qTimer = null;
  function onQueryInput(v) {
    if (qTimer) clearTimeout(qTimer);
    qTimer = setTimeout(function () { setQuery(v); }, 110);
  }

  /* ═══ 侧边栏开合 ═══ */
  function isMobile() { return window.matchMedia('(max-width:768px)').matches; }
  function toggleSidebar() {
    var sb = document.getElementById('sidebar');
    var main = document.getElementById('main');
    var scrim = document.getElementById('scrim');
    if (isMobile()) {
      var open = sb.classList.toggle('open');
      if (scrim) scrim.classList.toggle('on', open);
      return;
    }
    var hidden = sb.classList.toggle('hidden');
    main.classList.toggle('expanded', hidden);
  }
  function closeDrawer() {
    var sb = document.getElementById('sidebar');
    var scrim = document.getElementById('scrim');
    sb.classList.remove('open');
    if (scrim) scrim.classList.remove('on');
  }

  /* ═══ 滚动定位 ═══ */
  function scrollToStep(n) {
    var el = document.querySelector('[data-step="' + n + '"]');
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.remove('step-flash');
    void el.offsetWidth;
    el.classList.add('step-flash');
  }
  function focusStep(id, n) {
    var g = guideById(id);
    if (!g) return;
    setStepOpen(id, n, true);
    renderDetail(id);
    setTimeout(function () { scrollToStep(n); }, 60);
  }

  /* ═══ 路由 ═══ */
  function parseHash(h) {
    h = (h || '').replace(/^#/, '');
    if (!h) return { view: 'dashboard' };
    if (h === 'skills') return { view: 'skills' };
    if (h.indexOf('guide-') === 0) {
      var rest = h.slice(6);
      var m = rest.match(/^([^-]+)-step-(\d+)$/);
      if (m) return { view: 'detail', id: m[1], step: parseInt(m[2], 10) };
      return { view: 'detail', id: rest };
    }
    return { view: 'dashboard' };
  }
  function goHome() {
    if (location.hash) history.pushState(null, '', location.pathname + location.search);
    state.view = 'dashboard';
    state.guideId = null;
    state.filter = 'all';
    renderSidebar();
    renderDashboard();
    window.scrollTo(0, 0);
  }
  function goGuide(id) { location.hash = '#guide-' + id; }
  function goSkills() { location.hash = '#skills'; }

  function applyRoute(keepScroll) {
    var r = parseHash(location.hash);
    if (r.view === 'detail') {
      var g = guideById(r.id);
      if (!g) { goHome(); return; }
      state.view = 'detail';
      state.guideId = r.id;
      state.filter = g.cat;
      renderSidebar();
      if (r.step) { setStepOpen(r.id, r.step, true); renderDetail(r.id); setTimeout(function () { scrollToStep(r.step); }, 60); }
      else { renderDetail(r.id); if (!keepScroll) window.scrollTo(0, 0); }
    } else if (r.view === 'skills') {
      state.view = 'skills';
      state.guideId = null;
      state.filter = 'skills';
      renderSidebar();
      renderSkills();
      if (!keepScroll) window.scrollTo(0, 0);
    } else {
      state.view = 'dashboard';
      state.guideId = null;
      if (state.filter === 'skills') state.filter = 'all';
      renderSidebar();
      renderDashboard();
      if (!keepScroll) window.scrollTo(0, 0);
    }
    restoreFilterActive();
    closeDrawer();
    document.title = state.view === 'detail' && state.guideId
      ? guideTitle(guideById(state.guideId)) + ' · ' + t('appName')
      : t('docTitle');
  }

  /* ═══ 事件委托 ═══ */
  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var n = parseInt(el.getAttribute('data-n'), 10);

    if (act === 'open-guide') { e.preventDefault(); if (state.view === 'detail' && state.guideId === id) return; goGuide(id); return; }
    if (act === 'toggle-done') { e.preventDefault(); e.stopPropagation(); setDone(id, !isDone(id)); rerender(); refreshModal(); return; }
    if (act === 'step-jump') { e.preventDefault(); e.stopPropagation(); closeModal(); goGuide(id); setTimeout(function () { focusStep(id, n); }, 40); return; }
    if (act === 'open-modal') { e.preventDefault(); e.stopPropagation(); openModal(id); return; }
    if (act === 'close-modal') { e.preventDefault(); closeModal(); return; }
    if (act === 'step-done') { e.preventDefault(); e.stopPropagation(); setStepDone(id, n, !isStepDone(id, n)); rerender(); refreshModal(); return; }
    if (act === 'step-open') {
      e.preventDefault();
      setStepOpen(id, n, !isStepOpen(id, n));
      var box = el.parentNode;
      if (box) box.classList.toggle('is-open', isStepOpen(id, n));
      return;
    }
    if (act === 'copy') {
      e.preventDefault();
      var cb = el.closest('.code-block');
      var codeEl = cb ? cb.querySelector('code') : null;
      if (codeEl) copyText(codeEl.textContent);
      flashCopied(el);
      return;
    }
    if (act === 'copy-skill') { e.preventDefault(); copyText(el.textContent); flashCopied(el); return; }
    if (act === 'filter') {
      e.preventDefault();
      var cat = el.getAttribute('data-cat');
      if (cat === 'skills') { goSkills(); return; }
      state.filter = cat;
      if (state.view !== 'dashboard') {
        if (location.hash) history.pushState(null, '', location.pathname + location.search);
        state.view = 'dashboard';
        state.guideId = null;
      }
      renderSidebar();
      renderDashboard();
      restoreFilterActive();
      return;
    }
    if (act === 'sk-cat') { e.preventDefault(); state.skillCat = el.getAttribute('data-cat'); renderSkills(); restoreFilterActive(); return; }
    if (act === 'nav-skills') { e.preventDefault(); goSkills(); return; }
    if (act === 'home') { e.preventDefault(); goHome(); return; }
    if (act === 'sb-toggle') { e.preventDefault(); toggleSidebar(); return; }
    if (act === 'close-drawer') { closeDrawer(); return; }
    if (act === 'theme') { toggleTheme(); return; }
    if (act === 'lang') { toggleLang(); return; }
    if (act === 'share') { doShare(); return; }
    if (act === 'export') { exportProgress(); return; }
    if (act === 'import') { var f = document.getElementById('importFile'); if (f) { f.value = ''; f.click(); } return; }
    if (act === 'reset') { resetProgress(); return; }
    if (act === 'err-close') { var bar = document.getElementById('errBar'); if (bar) bar.classList.remove('on'); return; }
  }
  function flashCopied(btn) {
    if (!btn || !btn.classList) return;
    btn.classList.add('ok');
    var old = btn.getAttribute('data-old');
    if (!old) btn.setAttribute('data-old', btn.textContent);
    btn.textContent = t('copied');
    setTimeout(function () {
      btn.classList.remove('ok');
      var prev = btn.getAttribute('data-old');
      if (prev) btn.textContent = prev;
    }, 1800);
  }

  /* ═══ 键盘 ═══ */
  function onKey(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('modal').classList.contains('on')) closeModal();
      else if (isMobile() && document.getElementById('sidebar').classList.contains('open')) closeDrawer();
      return;
    }
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(el2tag(e.target))) {
      var sb = document.getElementById('sbSearch');
      if (sb) { e.preventDefault(); sb.focus(); }
      return;
    }
    if (e.key === 'Enter') {
      var tgt = e.target;
      if (tgt && tgt.getAttribute && tgt.getAttribute('data-act') === 'step-open') { e.preventDefault(); tgt.click(); }
    }
  }
  function el2tag(el) { return el && el.tagName ? el.tagName : ''; }

  /* ═══ 时钟 ═══ */
  function tick() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var el = document.getElementById('clock');
    if (el) el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  /* ═══ 全局错误条 ═══ */
  window.onerror = function (msg, src, line, col) {
    var bar = document.getElementById('errBar');
    var m = document.getElementById('errMsg');
    if (m) m.textContent = String(msg) + ' @' + (line || 0) + ':' + (col || 0);
    if (bar) bar.classList.add('on');
    if (window.console && console.error) console.error(msg, src, line, col);
    return false;
  };

  /* ═══ init ═══ */
  function init() {
    if (lsGet('theme', 'dark') === 'light') document.documentElement.classList.add('light');
    applyStaticI18n();
    syncThemeIcon();

    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);

    var sb = document.getElementById('sbSearch');
    var ts = document.getElementById('topSearch');
    if (sb) sb.addEventListener('input', function () { onQueryInput(this.value); });
    if (ts) ts.addEventListener('input', function () { onQueryInput(this.value); });

    var file = document.getElementById('importFile');
    if (file) file.addEventListener('change', function () { importProgress(this.files && this.files[0]); });

    window.addEventListener('hashchange', function () { applyRoute(); });
    window.addEventListener('popstate', function () { applyRoute(); });
    window.addEventListener('resize', function () {
      if (!isMobile()) {
        var scrim = document.getElementById('scrim');
        if (scrim) scrim.classList.remove('on');
        document.getElementById('sidebar').classList.remove('open');
      }
    });

    applyRoute();
    tick();
    setInterval(tick, 1000);

    var loading = document.getElementById('loading');
    if (loading) {
      loading.classList.add('gone');
      setTimeout(function () { if (loading.parentNode) loading.parentNode.removeChild(loading); }, 420);
    }
  }

  function boot() {
    if (typeof GUIDES === 'undefined' || !GUIDES.length) {
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        if (typeof GUIDES !== 'undefined' && GUIDES.length) { clearInterval(timer); init(); }
        else if (tries > 50) { clearInterval(timer); init(); }
      }, 200);
      return;
    }
    init();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
